name: Windows MSI installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build AirStereo
        shell: pwsh
        run: ./build.ps1
      - name: Prepare WiX 4.0.6
        shell: pwsh
        run: |
          $packages = @(
            @{ Id = 'wix'; File = 'wix.4.0.6.nupkg'; Destination = 'packages/wix-tools/wix-4.0.6' },
            @{ Id = 'wixtoolset.ui.wixext'; File = 'wixtoolset.ui.wixext.4.0.6.nupkg'; Destination = 'packages/wix-tools/wixtoolset.ui.wixext-4.0.6' },
            @{ Id = 'wixtoolset.util.wixext'; File = 'wixtoolset.util.wixext.4.0.6.nupkg'; Destination = 'packages/wix-tools/wixtoolset.util.wixext-4.0.6' }
          )
          foreach ($item in $packages) {
            $archive = Join-Path $env:RUNNER_TEMP $item.File
            $expanded = Join-Path $env:GITHUB_WORKSPACE $item.Destination
            Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/$($item.Id)/4.0.6/$($item.File)" -OutFile $archive
            New-Item -ItemType Directory -Path $expanded -Force | Out-Null
            Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          }
      - name: Package MSI installer
        shell: pwsh
        run: |
          $versionSource = Get-Content src/VersionInfo.cs -Raw
          $version = [regex]::Match($versionSource, 'AssemblyInformationalVersion\("([^"]+)"\)').Groups[1].Value
          if (-not $version) { throw 'Could not read the application version.' }
          $base = "packages/cloud-build-${{ github.run_id }}"
          ./installer/prepare-winui-payload.ps1 -SourceDirectory dist -PayloadDirectory "$base/payload" -Version $version -DotNetRoot $env:DOTNET_ROOT
          ./installer/package-msi.ps1 -PayloadDirectory "$base/payload" -OutputDirectory "$base/ready" -Version $version
          "BUILD_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: AirStereo-MSI-${{ env.BUILD_VERSION }}-${{ github.sha }}
          path: packages/cloud-build-${{ github.run_id }}/ready/AirStereo-*.msi*
          if-no-files-found: error
          retention-days: 14
